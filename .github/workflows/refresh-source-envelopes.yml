name: Refresh Source Envelopes

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a fresh 72-hour envelope now'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-source-envelopes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout mg-data
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0

      - name: Refresh envelopes when required
        id: refresh
        env:
          SOURCE_ENCRYPTION_KEY_HEX: ${{ secrets.SOURCE_ENCRYPTION_KEY_HEX }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          args=(--expiry-hours 72 --refresh-before-hours 24)
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python scripts/refresh_source_envelopes.py "${args[@]}"

      - name: Verify refreshed packs
        env:
          SOURCE_ENCRYPTION_KEY_HEX: ${{ secrets.SOURCE_ENCRYPTION_KEY_HEX }}
        run: |
          python scripts/refresh_source_envelopes.py --verify-only
          git diff --check -- sources.enc.json sources-green.enc.json

      - name: Commit refreshed envelopes
        if: steps.refresh.outputs.changed == 'true'
        env:
          REFRESHED_FILES: ${{ steps.refresh.outputs.files }}
        run: |
          git config user.name "source-envelope-bot"
          git config user.email "source-envelope-bot@users.noreply.github.com"
          git add sources.enc.json sources-green.enc.json
          git commit -m "chore: refresh encrypted source envelopes"
          git push
          echo "Refreshed: ${REFRESHED_FILES}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Source envelope refresh"
            echo "- Changed: ${{ steps.refresh.outputs.changed || 'unknown' }}"
            echo "- Files: ${{ steps.refresh.outputs.files || 'none' }}"
            echo "- Schedule: every 8 hours"
            echo "- Refresh threshold: 24 hours remaining"
            echo "- New validity: 72 hours"
          } >> "$GITHUB_STEP_SUMMARY"
