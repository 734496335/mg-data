name: Refresh Source Envelopes

on:
  push:
    paths:
      - '.github/workflows/refresh-source-envelopes.yml'
      - 'scripts/refresh_source_envelopes.py'
      - 'tests/test_refresh_source_envelopes.py'
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a fresh 72-hour envelope now'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-source-envelopes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout mg-data
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test and crypto dependencies
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0 pytest==8.4.1

      - name: Verify refresh state-machine tests
        run: python -m pytest tests/test_refresh_source_envelopes.py -q

      - name: Refresh envelopes when required
        id: refresh
        env:
          SOURCE_ENCRYPTION_KEY_HEX: ${{ secrets.SOURCE_ENCRYPTION_KEY_HEX }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          args=(--file sources.enc.json --expiry-hours 72 --refresh-before-hours 32)
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python scripts/refresh_source_envelopes.py "${args[@]}"

      - name: Verify refreshed packs
        env:
          SOURCE_ENCRYPTION_KEY_HEX: ${{ secrets.SOURCE_ENCRYPTION_KEY_HEX }}
        run: |
          python scripts/refresh_source_envelopes.py --file sources.enc.json --verify-only
          git diff --check -- sources.enc.json

      - name: Commit refreshed envelopes
        if: steps.refresh.outputs.changed == 'true'
        env:
          REFRESHED_FILES: ${{ steps.refresh.outputs.files }}
        run: |
          git config user.name "source-envelope-bot"
          git config user.email "source-envelope-bot@users.noreply.github.com"
          git add sources.enc.json
          git commit -m "chore: refresh encrypted source envelopes"
          git push
          echo "Refreshed: ${REFRESHED_FILES}"

      - name: Purge jsDelivr mutable-main caches
        if: steps.refresh.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 "https://purge.jsdelivr.net/gh/734496335/mg-data@main/sources.enc.json" >/dev/null

      - name: Verify required public authority convergence
        if: steps.refresh.outputs.changed == 'true'
        run: python scripts/verify_public_source_authority.py

      - name: Summary
        if: always()
        run: |
          {
            echo "## Source envelope refresh"
            echo "- Changed: ${{ steps.refresh.outputs.changed || 'unknown' }}"
            echo "- Files: ${{ steps.refresh.outputs.files || 'none' }}"
            echo "- Schedule: every 8 hours"
            echo "- Refresh threshold: 32 hours remaining"
            echo "- New validity: 72 hours"
          } >> "$GITHUB_STEP_SUMMARY"
